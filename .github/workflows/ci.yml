name: Urimai AI — Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Full Pytest Suite (89 Tests / 14 Modules)
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          ENVIRONMENT: "development"
          JWT_SECRET: "ci-test-jwt-secret-key-urimai-ai-32-chars-long"
          ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
          RATE_LIMIT_ENABLED: "true"
          LLM_ENABLED: "false"
        run: |
          pytest -v --durations=10

      - name: Verify Migration Sequence & Integrity
        run: |
          pytest tests/test_migration_sequence.py -v

      - name: Run Production Security Policy Audit
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python scripts/verify_production_security.py

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000"
        run: npm run build
